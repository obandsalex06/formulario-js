<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
<h1>FORMULARIO SENA V1</h1>
<h3>GRACIAS POR DEJAR SUS DATOS</h3>

<div class="formulario">
<form>
<label for="nombre">Nombre</label>
<input type="text" id="nombre" placeholder="Por favor, ingresa tu nombre">

<label for="correo">Correo electrónico</label>
<input type="email" id="correo" placeholder="Por favor, ingresa tu correo">

<label for="edad">Edad</label>
<input type="number" id="edad" placeholder="Por favor, ingresa tu edad">

<label for="opcion">Elige una opción</label>
<select id="opcion">
<option>Selecciona una opción</option>
<option>Opción 1</option>
<option>Opción 2</option>
</select>

<label>¿Planeas comprar un carro nuevo en los próximos 5 años?</label>
<label><input type="radio" name="comprarCarro" value="si"> Sí</label>
<label><input type="radio" name="comprarCarro" value="no"> No</label>
<label><input type="radio" name="comprarCarro" value="quizas"> Tal vez</label>

<label for="marcaCarro">¿Cuál es tu marca de carro favorita?</label>
<select id="marcaCarro">
<option>Selecciona una opción</option>
<option>Toyota</option>
<option>Chevrolet</option>
<option>Ford</option>
<option>Otra</option>
</select>

<label>¿Qué medios de transporte posees?</label>
<label><input type="checkbox" name="transporte" value="carro"> Carro</label>
<label><input type="checkbox" name="transporte" value="bote"> Bote</label>
<label><input type="checkbox" name="transporte" value="bicicleta"> Bicicleta</label>
<label><input type="checkbox" name="transporte" value="moto"> Motocicleta</label>
<label><input type="checkbox" name="transporte" value="avion"> Avión</label>
<label><input type="checkbox" name="transporte" value="patineta"> Patineta</label>

<label for="comentarios">¿Tienes algún comentario o sugerencia?</label>
<textarea id="comentarios" placeholder="Escribe tus comentarios aquí..."></textarea>

<input class="boton" type="submit" value="Enviar">
</form>
</div>

</body>
</html>
